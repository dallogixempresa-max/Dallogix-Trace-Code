name: Build Windows Installer

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate-server-deploy:
    name: Validate guarded production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse deployment shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh scripts/tests/*.sh; do
            bash -n "$script"
          done

      - name: Test the guarded deploy contract
        shell: bash
        run: bash scripts/tests/test_deploy_from_git.sh

  build:
    name: Compile and validate TraceSetup.exe
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Parse installer PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path implantacao/windows -Filter '*.ps1' -File -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
            }
          }
          Write-Host "PowerShell parse passed for $($files.Count) installer scripts."

      - name: Check installer environment and Compose arguments
        shell: pwsh
        run: ./implantacao/windows/Test-InstallerEnv.ps1

      - name: Build and inspect installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = (& git describe --tags --exact-match HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'The workflow must build an exact semantic-version tag.'
          }

          & .\implantacao\windows\Build-TraceSetup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build-TraceSetup.ps1 failed.' }

          $setup = Get-Item .\implantacao\windows\Output\TraceSetup.exe
          if ($setup.Length -lt 10MB) { throw 'TraceSetup.exe is unexpectedly small.' }
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashLine = "$hash  TraceSetup.exe"
          Set-Content -LiteralPath .\implantacao\windows\Output\TraceSetup.sha256.txt -Value $hashLine -Encoding ascii
          $signature = Get-AuthenticodeSignature -FilePath $setup.FullName
          Write-Host "Version: $tag"
          Write-Host "Commit:  $(git rev-parse HEAD)"
          Write-Host "Bytes:   $($setup.Length)"
          Write-Host "SHA256:  $hash"
          Write-Host "Signature status: $($signature.Status)"
          if ($signature.Status -ne 'Valid') {
            Write-Warning 'The corporate Authenticode certificate is not configured; this artifact is unsigned.'
          }

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TraceSetup-${{ github.ref_name }}
          path: |
            implantacao/windows/Output/TraceSetup.exe
            implantacao/windows/Output/TraceSetup.sha256.txt
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    name: Deploy tagged release to trace.dallogix.com
    runs-on: ubuntu-latest
    needs:
      - validate-server-deploy
      - build
    timeout-minutes: 25
    concurrency:
      group: trace-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out the exact tagged source and production history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag and production ancestry
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF_TYPE" == tag && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --quiet --no-tags origin production
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$GITHUB_SHA" ]]

      - name: Create the exact release bundle
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/trace-release.bundle" "refs/tags/$GITHUB_REF_NAME"
          git bundle verify "$RUNNER_TEMP/trace-release.bundle"

      - name: Send the tagged release through the restricted deploy key
        shell: bash
        env:
          TRACE_PROD_DEPLOY_KEY: ${{ secrets.TRACE_PROD_DEPLOY_KEY }}
          TRACE_PROD_HOST: 164.152.197.177
        run: |
          set -euo pipefail
          [[ -n "$TRACE_PROD_DEPLOY_KEY" ]] || {
            echo 'Repository secret TRACE_PROD_DEPLOY_KEY is not configured.' >&2
            exit 2
          }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$TRACE_PROD_DEPLOY_KEY" > "$HOME/.ssh/trace-production"
          chmod 600 "$HOME/.ssh/trace-production"
          ssh-keygen -y -f "$HOME/.ssh/trace-production" >/dev/null
          ssh -T \
            -i "$HOME/.ssh/trace-production" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/trace-production-known-hosts" \
            "trace-deploy@$TRACE_PROD_HOST" \
            "deploy $GITHUB_REF_NAME $GITHUB_SHA" \
            < "$RUNNER_TEMP/trace-release.bundle"
          rm -f "$HOME/.ssh/trace-production"
