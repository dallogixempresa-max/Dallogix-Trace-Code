name: Windows installer

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  compose-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test Keyence TCP, FTP, and image association
        run: node --test testes/keyence-worker.mjs
      - name: Validate industrial Docker Compose configuration
        shell: bash
        env:
          MYSQL_PASSWORD: trace-ci-password
          MYSQL_ROOT_PASSWORD: trace-ci-root-password
          TRACE_DEVICE_TOKEN: trace-ci-device-token
          KEYENCE_DEVICE_TOKEN: trace-ci-device-token
          KEYENCE_FTP_PASSWORD: trace-ci-ftp-password
        run: |
          set -euo pipefail
          docker compose --env-file .env.example --profile industrial config --quiet

  deploy-guard-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Parse production deploy scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh scripts/tests/*.sh; do
            bash -n "$script"
          done
      - name: Test the guarded deployment contract
        shell: bash
        run: bash scripts/tests/test_deploy_from_git.sh

  pull-request-build:
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Parse PowerShell and test industrial settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path implantacao/windows -Filter '*.ps1' -File -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
            }
          }
          & ./implantacao/windows/Test-TraceIndustrialConfiguration.ps1
          & ./implantacao/windows/Test-InstallerEnv.ps1
      - name: Build unsigned review installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./implantacao/windows/Build-TraceSetup.ps1 -AllowUnreleased
          if ($LASTEXITCODE -ne 0) { throw 'TraceSetup build failed.' }
          $setup = Get-Item ./implantacao/windows/Output/TraceSetup.exe
          if ($setup.Length -lt 10MB) { throw 'TraceSetup.exe is unexpectedly small.' }
          $desktopPublish = Join-Path $env:GITHUB_WORKSPACE 'desktop\DallogixTrace\bin\Release\net8.0-windows\win-x64\publish'
          foreach ($requiredFile in @('DallogixTrace.exe', 'WebView2Loader.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $desktopPublish $requiredFile) -PathType Leaf)) {
              throw "Desktop updater payload is missing $requiredFile."
            }
          }
          if (-not (Test-Path -LiteralPath './desktop/DallogixTrace/trace.ico' -PathType Leaf)) {
            throw 'Desktop updater payload is missing trace.ico.'
          }
          $payloadStage = Join-Path $env:RUNNER_TEMP 'trace-updater-payload-review'
          New-Item -ItemType Directory -Force -Path $payloadStage | Out-Null
          foreach ($entry in @(Get-ChildItem -LiteralPath $desktopPublish -Force)) {
            Copy-Item -LiteralPath $entry.FullName -Destination $payloadStage -Recurse -Force
          }
          Copy-Item -LiteralPath './desktop/DallogixTrace/trace.ico' -Destination (Join-Path $payloadStage 'trace.ico') -Force
          $payloadArchive = Join-Path $env:RUNNER_TEMP 'trace-updater-payload-review.tar.gz'
          & tar.exe -czf $payloadArchive -C $payloadStage .
          if ($LASTEXITCODE -ne 0) { throw 'Could not create a review updater package.' }
          $payloadEntries = @(& tar.exe -tzf $payloadArchive)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the review updater package.' }
          $normalizedPayloadEntries = @($payloadEntries | ForEach-Object { [string]$_ -replace '^[.][\/]', '' })
          foreach ($requiredFile in @('DallogixTrace.exe', 'WebView2Loader.dll', 'trace.ico')) {
            if ($normalizedPayloadEntries -notcontains $requiredFile) {
              throw "Review updater package is missing $requiredFile."
            }
          }
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ./implantacao/windows/Output/TraceSetup.sha256.txt -Value "$hash  TraceSetup.exe" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: TraceSetup-review-${{ github.event.pull_request.number }}
          path: |
            implantacao/windows/Output/TraceSetup.exe
            implantacao/windows/Output/TraceSetup.sha256.txt
          if-no-files-found: error
          retention-days: 14

  validate-release-ref:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release tag before exposing environment secrets
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$GITHUB_SHA" ]]
          git fetch --quiet --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/production:refs/remotes/origin/production
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          git merge-base --is-ancestor refs/remotes/origin/production "$GITHUB_SHA"

  preflight-updater-signing:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    environment: production-release
    needs: validate-release-ref
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate updater signing key before production deployment
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: ./implantacao/windows/Test-TraceUpdaterSigningPrerequisites.ps1

  deploy-production:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: preflight-updater-signing
    runs-on: ubuntu-24.04
    concurrency:
      group: trace-production-deploy
      cancel-in-progress: false
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release tag and fast-forward ancestry
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$GITHUB_SHA" ]]
          git fetch --quiet --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/production:refs/remotes/origin/production
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          git merge-base --is-ancestor refs/remotes/origin/production "$GITHUB_SHA"
      - name: Create and verify the exact release bundle
        shell: bash
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/trace-release.bundle" "refs/tags/$GITHUB_REF_NAME"
          git bundle verify "$RUNNER_TEMP/trace-release.bundle"
      - name: Send the tagged release through the restricted deploy key
        shell: bash
        env:
          TRACE_PROD_DEPLOY_KEY: ${{ secrets.TRACE_PROD_DEPLOY_KEY }}
          TRACE_PROD_HOST: 164.152.197.177
        run: |
          set -euo pipefail
          [[ -n "$TRACE_PROD_DEPLOY_KEY" ]] || {
            echo 'Repository secret TRACE_PROD_DEPLOY_KEY is not configured.' >&2
            exit 2
          }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$TRACE_PROD_DEPLOY_KEY" > "$HOME/.ssh/trace-production"
          chmod 600 "$HOME/.ssh/trace-production"
          ssh-keygen -y -f "$HOME/.ssh/trace-production" >/dev/null
          ssh -T \
            -i "$HOME/.ssh/trace-production" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/trace-production-known-hosts" \
            "trace-deploy@$TRACE_PROD_HOST" \
            "deploy $GITHUB_REF_NAME $GITHUB_SHA" \
            < "$RUNNER_TEMP/trace-release.bundle"
          rm -f "$HOME/.ssh/trace-production"

  validate-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: deploy-production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Confirm tag, main ancestry, and exact production deployment
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$GITHUB_SHA" ]]
          git fetch --quiet --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          health="$(curl --fail --silent --show-error --max-time 15 https://trace.dallogix.com/api/health.php)"
          jq -e --arg version "$tag" --arg commit "$GITHUB_SHA" \
            '.status == "ok" and .installation_mode == "central" and .version == $version and (.commit | ascii_downcase) == ($commit | ascii_downcase)' \
            <<< "$health" >/dev/null
      - name: Advance the production branch to the deployed release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin refs/heads/production:refs/remotes/origin/production
          git merge-base --is-ancestor refs/remotes/origin/production "$GITHUB_SHA"
          git push origin "$GITHUB_SHA:refs/heads/production"

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate-release
    runs-on: windows-2022
    environment: production-release
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Parse PowerShell and test industrial settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path implantacao/windows -Filter '*.ps1' -File -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
            }
          }
          & ./implantacao/windows/Test-TraceIndustrialConfiguration.ps1
      - name: Build unsigned release installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./implantacao/windows/Build-TraceSetup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'TraceSetup build failed.' }
          $setup = Get-Item ./implantacao/windows/Output/TraceSetup.exe
          if ($setup.Length -lt 10MB) { throw 'TraceSetup.exe is unexpectedly small.' }

      - name: Create unsigned installer checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-Item ./implantacao/windows/Output/TraceSetup.exe
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ./implantacao/windows/Output/TraceSetup.sha256.txt -Value "$hash  TraceSetup.exe" -Encoding ascii
      - name: Create signed updater package and manifest
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY)) {
            throw 'UPDATE_SIGNING_PRIVATE_KEY is required to sign the updater manifest.'
          }
          $tag = $env:GITHUB_REF_NAME
          $commit = (& git rev-parse HEAD).Trim()
          $stage = Join-Path $env:RUNNER_TEMP 'trace-release-source'
          $archiveZip = Join-Path $env:RUNNER_TEMP 'trace-source.zip'
          $archivePath = Join-Path $env:RUNNER_TEMP "trace-$tag.tar.gz"
          $privatePath = Join-Path $env:RUNNER_TEMP 'trace-update-private.pem'
          $derivedPublic = Join-Path $env:RUNNER_TEMP 'trace-derived-public.der'
          $expectedPublic = Join-Path $env:RUNNER_TEMP 'trace-expected-public.der'
          $payloadPath = Join-Path $env:RUNNER_TEMP 'manifest-payload.txt'
          $signaturePath = Join-Path $env:RUNNER_TEMP 'manifest-signature.bin'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'manifest.json'
          try {
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            & git archive --format=zip "--output=$archiveZip" HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not export the exact tagged source tree.' }
            Expand-Archive -LiteralPath $archiveZip -DestinationPath $stage
            [IO.File]::WriteAllText((Join-Path $stage 'trace-build-version.txt'), "$tag`n", (New-Object System.Text.UTF8Encoding($false)))
            [IO.File]::WriteAllText((Join-Path $stage 'trace-build-commit.txt'), "$commit`n", (New-Object System.Text.UTF8Encoding($false)))
            $desktopPublish = Join-Path $env:GITHUB_WORKSPACE 'desktop\DallogixTrace\bin\Release\net8.0-windows\win-x64\publish'
            $desktopIcon = Join-Path $env:GITHUB_WORKSPACE 'desktop\DallogixTrace\trace.ico'
            foreach ($requiredFile in @('DallogixTrace.exe', 'WebView2Loader.dll')) {
              if (-not (Test-Path -LiteralPath (Join-Path $desktopPublish $requiredFile) -PathType Leaf)) {
                throw "Desktop updater payload is missing $requiredFile."
              }
            }
            if (-not (Test-Path -LiteralPath $desktopIcon -PathType Leaf)) {
              throw 'Desktop updater payload is missing trace.ico.'
            }
            $desktopPublishEntries = @(Get-ChildItem -LiteralPath $desktopPublish -Force)
            if ($desktopPublishEntries.Count -eq 0) { throw 'Desktop publish directory is empty.' }
            foreach ($entry in $desktopPublishEntries) {
              Copy-Item -LiteralPath $entry.FullName -Destination $stage -Recurse -Force
            }
            Copy-Item -LiteralPath $desktopIcon -Destination (Join-Path $stage 'trace.ico') -Force
            foreach ($requiredFile in @('DallogixTrace.exe', 'WebView2Loader.dll', 'trace.ico')) {
              if (-not (Test-Path -LiteralPath (Join-Path $stage $requiredFile) -PathType Leaf)) {
                throw "Staged updater package is missing $requiredFile."
              }
            }
            & tar.exe -czf $archivePath -C $stage .
            if ($LASTEXITCODE -ne 0) { throw 'Could not create updater package.' }
            $packageEntries = @(& tar.exe -tzf $archivePath)
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the updater package.' }
            $normalizedPackageEntries = @($packageEntries | ForEach-Object { [string]$_ -replace '^[.][\/]', '' })
            foreach ($requiredFile in @('DallogixTrace.exe', 'WebView2Loader.dll', 'trace.ico')) {
              if ($normalizedPackageEntries -notcontains $requiredFile) {
                throw "Updater package archive is missing $requiredFile."
              }
            }

            [IO.File]::WriteAllText($privatePath, $env:UPDATE_PRIVATE_KEY, (New-Object System.Text.UTF8Encoding($false)))
            $openssl = Join-Path $env:ProgramFiles 'Git\usr\bin\openssl.exe'
            if (-not (Test-Path -LiteralPath $openssl -PathType Leaf)) { throw 'OpenSSL from Git for Windows was not found.' }
            & $openssl pkey -in $privatePath -pubout -outform DER -out $derivedPublic
            if ($LASTEXITCODE -ne 0) { throw 'The updater private key could not be parsed.' }
            & $openssl pkey -pubin -in ./servidor/configuracao/trace-update-public.pem -outform DER -out $expectedPublic
            if ($LASTEXITCODE -ne 0) { throw 'The tracked updater public key could not be parsed.' }
            $derivedHash = (Get-FileHash -LiteralPath $derivedPublic -Algorithm SHA256).Hash
            $expectedHash = (Get-FileHash -LiteralPath $expectedPublic -Algorithm SHA256).Hash
            if ($derivedHash -ne $expectedHash) { throw 'UPDATE_SIGNING_PRIVATE_KEY does not match the tracked updater public key.' }

            $artifactUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/trace-$tag.tar.gz"
            $packageHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText($payloadPath, "$tag`n$artifactUrl`n$packageHash`n", (New-Object System.Text.UTF8Encoding($false)))
            & $openssl dgst -sha256 -sign $privatePath -out $signaturePath $payloadPath
            if ($LASTEXITCODE -ne 0) { throw 'Updater manifest signing failed.' }
            $signature = [Convert]::ToBase64String([IO.File]::ReadAllBytes($signaturePath))
            $manifest = [ordered]@{
              version = $tag
              channel = 'stable'
              artifact_url = $artifactUrl
              sha256 = $packageHash
              signature = $signature
            } | ConvertTo-Json -Depth 4
            [IO.File]::WriteAllText($manifestPath, $manifest + "`n", (New-Object System.Text.UTF8Encoding($false)))
            $manifestDirectory = Join-Path $env:RUNNER_TEMP 'trace-release-assets'
            New-Item -ItemType Directory -Force -Path $manifestDirectory | Out-Null
            Copy-Item $archivePath (Join-Path $manifestDirectory "trace-$tag.tar.gz")
            Copy-Item $manifestPath (Join-Path $manifestDirectory 'manifest.json')
            Copy-Item ./implantacao/windows/Output/TraceSetup.exe $manifestDirectory
            Copy-Item ./implantacao/windows/Output/TraceSetup.sha256.txt $manifestDirectory
          } finally {
            if (Test-Path -LiteralPath $privatePath -PathType Leaf) {
              Remove-Item -LiteralPath $privatePath -Force
            }
          }
      - name: Publish GitHub release with unsigned installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'trace-release-assets'
          gh release create $env:GITHUB_REF_NAME `
            (Join-Path $assets "trace-$env:GITHUB_REF_NAME.tar.gz") `
            (Join-Path $assets 'manifest.json') `
            (Join-Path $assets 'TraceSetup.exe') `
            (Join-Path $assets 'TraceSetup.sha256.txt') `
            --verify-tag --title $env:GITHUB_REF_NAME `
            --notes 'The Windows installer is not Authenticode signed. Verify TraceSetup.sha256.txt before running it; Windows may show an unknown-publisher warning. The updater manifest is RSA-signed. This release was built from the same commit already deployed to trace.dallogix.com.'
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the GitHub release.' }
