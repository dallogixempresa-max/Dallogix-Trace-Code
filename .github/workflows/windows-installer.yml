name: Windows installer

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  compose-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate industrial Docker Compose configuration
        shell: bash
        env:
          MYSQL_PASSWORD: trace-ci-password
          MYSQL_ROOT_PASSWORD: trace-ci-root-password
          TRACE_DEVICE_TOKEN: trace-ci-device-token
          CAMERA_DEVICE_TOKEN: trace-ci-camera-token
        run: |
          set -euo pipefail
          docker compose --env-file .env.example --profile industrial config --quiet

  pull-request-build:
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Parse PowerShell and test industrial settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path implantacao/windows -Filter '*.ps1' -File -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
            }
          }
          & ./implantacao/windows/Test-TraceIndustrialConfiguration.ps1
      - name: Build unsigned review installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./implantacao/windows/Build-TraceSetup.ps1 -AllowUnreleased
          if ($LASTEXITCODE -ne 0) { throw 'TraceSetup build failed.' }
          $setup = Get-Item ./implantacao/windows/Output/TraceSetup.exe
          if ($setup.Length -lt 10MB) { throw 'TraceSetup.exe is unexpectedly small.' }
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ./implantacao/windows/Output/TraceSetup.sha256.txt -Value "$hash  TraceSetup.exe" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: TraceSetup-review-${{ github.event.pull_request.number }}
          path: |
            implantacao/windows/Output/TraceSetup.exe
            implantacao/windows/Output/TraceSetup.sha256.txt
          if-no-files-found: error
          retention-days: 14

  validate-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm tag, main ancestry, and exact production deployment
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$GITHUB_SHA" ]]
          git fetch --quiet --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
          health="$(curl --fail --silent --show-error --max-time 15 https://trace.dallogix.com/api/health.php)"
          jq -e --arg version "$tag" --arg commit "$GITHUB_SHA" \
            '.status == "ok" and .installation_mode == "central" and .version == $version and (.commit | ascii_downcase) == ($commit | ascii_downcase)' \
            <<< "$health" >/dev/null

  signed-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate-release
    runs-on: windows-2022
    environment: production-release
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Parse PowerShell and test industrial settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path implantacao/windows -Filter '*.ps1' -File -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
            }
          }
          & ./implantacao/windows/Test-TraceIndustrialConfiguration.ps1
      - name: Build and sign installer with corporate Authenticode certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.AUTHENTICODE_CERTIFICATE_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.AUTHENTICODE_CERTIFICATE_PASSWORD }}
          SIGNING_EXPECTED_THUMBPRINT: ${{ vars.AUTHENTICODE_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('SIGNING_PFX_BASE64', 'SIGNING_PFX_PASSWORD', 'SIGNING_EXPECTED_THUMBPRINT')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Production environment setting $name is required; no installer will be published unsigned."
            }
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'dallogix-codesign.pfx'
          $pfxBytes = [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          $securePassword = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          try {
            $pfx = Get-PfxData -FilePath $pfxPath -Password $securePassword
            $certificate = @($pfx.EndEntityCertificates)[0]
            if (-not $certificate) { throw 'PFX does not contain an end-entity certificate.' }
            if ($certificate.Thumbprint -ne ($env:SIGNING_EXPECTED_THUMBPRINT -replace '\s', '').ToUpperInvariant()) {
              throw 'PFX thumbprint does not match AUTHENTICODE_CERTIFICATE_THUMBPRINT.'
            }
            if ($certificate.NotBefore.ToUniversalTime() -gt [DateTime]::UtcNow -or
                $certificate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) {
              throw 'The corporate signing certificate is outside its validity period.'
            }
            $ekuExtension = $certificate.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.37' } | Select-Object -First 1
            $hasCodeSigningEku = $false
            if ($ekuExtension) {
              $hasCodeSigningEku = @(([Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]$ekuExtension).EnhancedKeyUsages | Where-Object { $_.Value -eq '1.3.6.1.5.5.7.3.3' }).Count -gt 0
            }
            if (-not $hasCodeSigningEku) { throw 'The configured certificate does not have the Code Signing EKU.' }
            Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword | Out-Null
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

          & ./implantacao/windows/Build-TraceSetup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'TraceSetup build failed.' }
          $setup = Get-Item ./implantacao/windows/Output/TraceSetup.exe
          if ($setup.Length -lt 10MB) { throw 'TraceSetup.exe is unexpectedly small.' }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object { [version]$_.VersionInfo.FileVersion } -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'Windows SDK signtool.exe was not found.' }
          & $signtool.FullName sign /sha1 $certificate.Thumbprint /s My /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed.' }
          & $signtool.FullName verify /pa /v $setup.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed.' }
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ./implantacao/windows/Output/TraceSetup.sha256.txt -Value "$hash  TraceSetup.exe" -Encoding ascii
      - name: Create signed updater package and manifest
        shell: pwsh
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_PRIVATE_KEY)) {
            throw 'UPDATE_SIGNING_PRIVATE_KEY is required to sign the updater manifest.'
          }
          $tag = $env:GITHUB_REF_NAME
          $commit = (& git rev-parse HEAD).Trim()
          $stage = Join-Path $env:RUNNER_TEMP 'trace-release-source'
          $archiveZip = Join-Path $env:RUNNER_TEMP 'trace-source.zip'
          $archivePath = Join-Path $env:RUNNER_TEMP "trace-$tag.tar.gz"
          $privatePath = Join-Path $env:RUNNER_TEMP 'trace-update-private.pem'
          $derivedPublic = Join-Path $env:RUNNER_TEMP 'trace-derived-public.der'
          $expectedPublic = Join-Path $env:RUNNER_TEMP 'trace-expected-public.der'
          $payloadPath = Join-Path $env:RUNNER_TEMP 'manifest-payload.txt'
          $signaturePath = Join-Path $env:RUNNER_TEMP 'manifest-signature.bin'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'manifest.json'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          & git archive --format=zip "--output=$archiveZip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not export the exact tagged source tree.' }
          Expand-Archive -LiteralPath $archiveZip -DestinationPath $stage
          [IO.File]::WriteAllText((Join-Path $stage 'trace-build-version.txt'), "$tag`n", (New-Object System.Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $stage 'trace-build-commit.txt'), "$commit`n", (New-Object System.Text.UTF8Encoding($false)))
          & tar.exe -czf $archivePath -C $stage .
          if ($LASTEXITCODE -ne 0) { throw 'Could not create updater package.' }

          [IO.File]::WriteAllText($privatePath, $env:UPDATE_PRIVATE_KEY, (New-Object System.Text.UTF8Encoding($false)))
          $openssl = Join-Path $env:ProgramFiles 'Git\usr\bin\openssl.exe'
          if (-not (Test-Path -LiteralPath $openssl -PathType Leaf)) { throw 'OpenSSL from Git for Windows was not found.' }
          & $openssl pkey -in $privatePath -pubout -outform DER -out $derivedPublic
          if ($LASTEXITCODE -ne 0) { throw 'The updater private key could not be parsed.' }
          & $openssl pkey -pubin -in ./servidor/configuracao/trace-update-public.pem -outform DER -out $expectedPublic
          if ($LASTEXITCODE -ne 0) { throw 'The tracked updater public key could not be parsed.' }
          $derivedHash = (Get-FileHash -LiteralPath $derivedPublic -Algorithm SHA256).Hash
          $expectedHash = (Get-FileHash -LiteralPath $expectedPublic -Algorithm SHA256).Hash
          if ($derivedHash -ne $expectedHash) { throw 'UPDATE_SIGNING_PRIVATE_KEY does not match the tracked updater public key.' }

          $artifactUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/trace-$tag.tar.gz"
          $packageHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($payloadPath, "$tag`n$artifactUrl`n$packageHash`n", (New-Object System.Text.UTF8Encoding($false)))
          & $openssl dgst -sha256 -sign $privatePath -out $signaturePath $payloadPath
          if ($LASTEXITCODE -ne 0) { throw 'Updater manifest signing failed.' }
          $signature = [Convert]::ToBase64String([IO.File]::ReadAllBytes($signaturePath))
          $manifest = [ordered]@{
            version = $tag
            channel = 'stable'
            artifact_url = $artifactUrl
            sha256 = $packageHash
            signature = $signature
          } | ConvertTo-Json -Depth 4
          [IO.File]::WriteAllText($manifestPath, $manifest + "`n", (New-Object System.Text.UTF8Encoding($false)))
          $manifestDirectory = Join-Path $env:RUNNER_TEMP 'trace-release-assets'
          New-Item -ItemType Directory -Force -Path $manifestDirectory | Out-Null
          Copy-Item $archivePath (Join-Path $manifestDirectory "trace-$tag.tar.gz")
          Copy-Item $manifestPath (Join-Path $manifestDirectory 'manifest.json')
          Copy-Item ./implantacao/windows/Output/TraceSetup.exe $manifestDirectory
          Copy-Item ./implantacao/windows/Output/TraceSetup.sha256.txt $manifestDirectory
          Remove-Item -LiteralPath $privatePath -Force -ErrorAction SilentlyContinue
      - name: Publish signed GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'trace-release-assets'
          gh release create $env:GITHUB_REF_NAME `
            (Join-Path $assets "trace-$env:GITHUB_REF_NAME.tar.gz") `
            (Join-Path $assets 'manifest.json') `
            (Join-Path $assets 'TraceSetup.exe') `
            (Join-Path $assets 'TraceSetup.sha256.txt') `
            --verify-tag --title $env:GITHUB_REF_NAME `
            --notes 'Signed Trace release. This release was built from the same commit already deployed to trace.dallogix.com.'
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the signed GitHub release.' }
